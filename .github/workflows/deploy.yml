name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Trust the VPS
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      - name: Upload the share service and restart it
        run: |
          rsync -az --delete -e "$SSH" shares/ "$TARGET:/srv/logistics-network/shares/"
          rsync -az -e "$SSH" package.json "$TARGET:/srv/logistics-network/"
          $SSH "$TARGET" "sudo systemctl restart logistics-shares"
          $SSH "$TARGET" "sleep 2 && systemctl is-active logistics-shares"
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SSH: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes
      - name: Upload the site
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes" dist/ "$TARGET:/srv/logistics-network/dist/"
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      - name: Upload the API and restart it
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes" server/ "$TARGET:/srv/logistics-network/server/"
          rsync -az -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes" package.json package-lock.json "$TARGET:/srv/logistics-network/"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "$TARGET" "cd /srv/logistics-network && npm ci --omit=dev && sudo systemctl restart logistics-network && sleep 3 && systemctl is-active --quiet logistics-network"
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
